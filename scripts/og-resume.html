<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Share card for ethantam.dev/resume</title>
  <!-- The link preview for /resume (og-resume.png, 1200x630). scripts/cv-pdf.mjs renders it with headless Chrome,
       and the sheet on the right is the CV from resume.html, copied in below, so the card can't drift from the CV.
       Not served: scripts/ is in .assetsignore. -->
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { position: relative; background: radial-gradient(900px circle at 0 0, rgba(242, 169, 59, .1), transparent 70%), var(--bg); }

    .og { position: absolute; top: 76px; bottom: 64px; left: 76px; width: 470px; display: flex; flex-direction: column; }
    .og p { margin: 0; }
    .og__name { color: var(--fg); font-size: 92px; font-weight: 600; line-height: 1; letter-spacing: -0.04em; }
    .og .og__tag { margin-top: 22px; color: var(--fg); font-size: 31px; font-weight: 500; line-height: 1.25; letter-spacing: -0.02em; }
    .og__tag em { font-family: var(--serif); font-weight: 400; font-size: 1.12em; color: var(--accent); }
    .og__facts { display: grid; gap: 8px; margin: 30px 0 0; padding: 0; list-style: none; color: var(--fg-2); font-size: 24px; line-height: 1.35; }
    .og .og__url { display: flex; align-items: center; gap: 14px; margin-top: auto; color: var(--muted); font: 23px var(--mono); }
    .og__url img { width: 30px; height: 30px; }

    /* the CV itself, tilted like the project screenshots on the home page, running off the bottom edge. It is laid out
       640px wide, for type big enough to read at a glance, then scaled down so its full width shows. */
    .og__sheet { position: absolute; top: 74px; left: 600px; width: 640px; transform: rotate(-2deg) scale(.86); transform-origin: 0 0; }
    .og__sheet .cv { animation: none; box-shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 40px 90px -20px rgba(0, 0, 0, .7); }
  </style>
  <meta name="app-version" content="1.10.4">
</head>
<body>
  <div class="og">
    <p class="og__name">Ethan Tam</p>
    <p class="og__tag">I build small tools that make <em>markets</em> legible.</p>
    <ul class="og__facts">
      <li>Economics at Cambridge, from 2027</li>
      <li>Finance Officer, Advisory Singapore</li>
    </ul>
    <p class="og__url"><img src="../assets/mark.svg" alt="">ethantam.dev/resume</p>
  </div>
  <div class="og__sheet sheet"></div>
  <script>
    fetch("../resume.html")
      .then((r) => r.text())
      .then((html) => {
        const cv = new DOMParser().parseFromString(html, "text/html").getElementById("cv");
        document.querySelector(".og__sheet").append(document.importNode(cv, true));
      });
  </script>
</body>
</html>
